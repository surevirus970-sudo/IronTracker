<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#263346" stroke-width="4"/>

  <!-- Barbell Graphic -->
  <g filter="url(#glow)">
    <!-- Barbell Center Bar -->
    <rect x="100" y="244" width="312" height="24" rx="8" fill="url(#neonGrad)"/>

    <!-- Left Plates -->
    <rect x="110" y="166" width="28" height="180" rx="10" fill="url(#neonGrad)"/>
    <rect x="74" y="196" width="24" height="120" rx="8" fill="url(#neonGrad)" opacity="0.85"/>
    <rect x="52" y="226" width="14" height="60" rx="6" fill="url(#neonGrad)" opacity="0.6"/>

    <!-- Right Plates -->
    <rect x="374" y="166" width="28" height="180" rx="10" fill="url(#neonGrad)"/>
    <rect x="414" y="196" width="24" height="120" rx="8" fill="url(#neonGrad)" opacity="0.85"/>
    <rect x="446" y="226" width="14" height="60" rx="6" fill="url(#neonGrad)" opacity="0.6"/>

    <!-- Lightning Accent in Center -->
    <path d="M 270 140 L 230 240 L 275 240 L 240 370 L 300 230 L 255 230 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
