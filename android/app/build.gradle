plugins {
    id 'com.android.application'
}

android {
    namespace 'com.irontrack.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.irontrack.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
}

dependencies {
    // Чистый Android WebView без тяжелых библиотек
}
